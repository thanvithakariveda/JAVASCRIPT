<!DOCTYPE html>
<html>
<head>
<title>Hello Layout</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
}

.container{
width:900px;
margin:auto;
background:white;
padding:20px;
}

.top{
background:#e9e9e9;
padding:20px;
}

.row{
display:flex;
margin-top:20px;
}

.box{
flex:1;
padding:15px;
background:#f7f7f7;
margin:10px;
}

button{
padding:6px 10px;
}

</style>
</head>

<body>

<div class="container">

<div class="top">
<h1>Hello, world!</h1>
<p>This is a simple layout example.</p>
<button>Learn more</button>
</div>

<div class="row">

<div class="box">
<h3>Heading</h3>
<p>Small paragraph text example.</p>
<button>View details</button>
</div>

<div class="box">
<h3>Heading</h3>
<p>Another text used for content.</p>
<button>View details</button>
</div>

<div class="box">
<h3>Heading</h3>
<p>More text for third column.</p>
<button>View details</button>
</div>

</div>

</div>

</body>
</html>
